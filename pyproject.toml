[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skip-alignments"
version = "0.2.1"
description = "Skip-probability derivation for process trees"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Adam Burke", email = "44078052+adamburkegh@users.noreply.github.com" },
]
keywords = ["process mining", "conformance checking", "alignments", "process trees", "BPM"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas",
    "pm4py",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/adamburkegh/skip-alignments"
Repository = "https://github.com/adamburkegh/skip-alignments"

[project.optional-dependencies]
dev = ["build", "twine"]

[tool.setuptools.packages.find]
where = ["src"]
