[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skipprobabilities"
version = "0.1.0"
description = "Skip-probability derivation for process trees"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "pm4py",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]